    <style>
      :root { --ink:#1d2433; --coral:#ff725e; --yellow:#ffc844; --cream:#fff9ed; --blue:#cbeef0; --mint:#d7f4cf; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); background:var(--cream); font-family:'Gowun Dodum', sans-serif; overflow-x:hidden; }
      .texture { position:fixed; inset:0; opacity:.38; pointer-events:none; background-image:radial-gradient(#d9cdb7 .7px,transparent .8px); background-size:12px 12px; }
      .shell { width:min(1180px,calc(100% - 40px)); margin:auto; position:relative; }
      header { height:70px; display:flex; align-items:center; justify-content:space-between; }
      .logo { display:flex; align-items:center; gap:10px; font-family:'Jua',sans-serif; font-size:22px; }
      .logo-mark { width:33px; height:33px; border-radius:50%; display:grid; place-items:center; background:var(--coral); color:white; transform:rotate(-8deg); box-shadow:3px 3px 0 #1d2433; }
      .tag { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.04em; border:1.5px solid var(--ink); border-radius:99px; padding:8px 12px; background:#fffdf7; }
      main { min-height:calc(100vh - 100px); display:grid; grid-template-columns: .95fr 1.05fr; align-items:center; gap:36px; padding:10px 0 14px; }
      .eyebrow { font:500 12px 'DM Mono',monospace; letter-spacing:.1em; display:inline-flex; gap:8px; align-items:center; background:var(--yellow); padding:8px 12px; transform:rotate(-2deg); }
      .eyebrow span { width:7px; height:7px; background:var(--coral); border-radius:50%; }
      h1 { font-family:'Jua',sans-serif; font-size:clamp(48px,6vw,82px); line-height:1.08; letter-spacing:-.04em; margin:22px 0 20px; }
      h1 em { color:var(--coral); font-style:normal; }
      .intro { font-size:17px; line-height:1.8; max-width:430px; margin:0; color:#4b5260; }
      .mobile-break { display:none; }
      .tips { display:flex; gap:10px; flex-wrap:wrap; margin-top:28px; }
      .tips span { color:#5d6470; padding:3px 0; font-size:13px; }
      .roulette-zone { position:relative; display:grid; place-items:center; padding:38px 10px 0; }
      .sun { position:absolute; top:48px; left:50%; width:min(72vw,430px); aspect-ratio:1; border-radius:50%; background:var(--yellow); transform:translateX(-50%) translate(10px,10px); z-index:-1; }
      .wheel-wrap { position:relative; width:min(72vw,430px); aspect-ratio:1; filter:drop-shadow(8px 9px 0 rgba(29,36,51,.98)); }
      .pointer { position:absolute; z-index:4; top:-13px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:22px solid transparent; border-right:22px solid transparent; border-top:50px solid var(--coral); filter:drop-shadow(2px 2px 0 var(--ink)); }
      #wheel { display:block; overflow:visible; width:100%; height:100%; border-radius:50%; }
      #disk { transform-box:view-box; transform-origin:center; transition:transform 4.2s cubic-bezier(.13,.78,.1,1); }
      .hub { position:absolute; inset:0; margin:auto; width:91px; height:91px; z-index:2; border:2px solid var(--ink); border-radius:50%; background:#fffdf7; display:grid; place-items:center; text-align:center; font-family:'Jua',sans-serif; line-height:1.05; font-size:17px; pointer-events:none; transition:opacity .2s; }
      .hub small { display:block; font:10px 'DM Mono',monospace; margin-top:3px; }
      .roulette-toolbar { position:absolute; top:10px; right:6px; z-index:7; }
      .menu-editor-toggle { border:2px solid var(--ink); border-radius:999px; background:#fffdf7; padding:8px 14px; font:14px 'Jua',sans-serif; color:var(--ink); cursor:pointer; box-shadow:3px 3px 0 var(--coral); transition:transform .15s, box-shadow .15s; }
      .menu-editor-toggle:hover { transform:translate(1px,1px); box-shadow:2px 2px 0 var(--coral); }
      .menu-editor { position:absolute; top:54px; right:0; width:min(300px,78vw); background:#fffdf7; border:2px solid var(--ink); border-radius:16px; box-shadow:6px 6px 0 var(--coral); padding:16px 14px 12px; z-index:8; display:none; }
      .menu-editor.open { display:block; }
      .menu-editor-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-family:'Jua',sans-serif; font-size:18px; }
      .menu-editor-close { border:0; background:transparent; font-size:22px; cursor:pointer; color:var(--ink); line-height:1; }
      .menu-list { display:flex; flex-direction:column; gap:8px; max-height:210px; overflow:auto; padding-right:4px; }
      .menu-item { display:flex; align-items:center; justify-content:space-between; gap:8px; border:1.5px solid rgba(29,36,51,.3); border-radius:10px; padding:7px 8px 7px 10px; background:#fff; }
      .menu-item span { font-size:14px; line-height:1.2; word-break:break-word; }
      .remove-menu { width:28px; height:28px; border:1.5px solid var(--ink); border-radius:50%; background:var(--cream); color:var(--ink); font-size:16px; line-height:1; cursor:pointer; }
      .menu-editor-form { display:flex; gap:8px; margin-top:12px; align-items:stretch; }
      .menu-editor-form input { flex:1 1 auto; min-width:0; width:100%; border:1.5px solid var(--ink); border-radius:10px; padding:10px 12px; font-size:14px; font-family:'Gowun Dodum',sans-serif; background:#fffdf7; }
      .menu-editor-form button { flex:0 0 auto; border:2px solid var(--ink); border-radius:10px; padding:9px 12px; background:var(--yellow); font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; white-space:nowrap; }
      .quick-toggle { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; font-size:14px; color:#3c4552; font-weight:700; }
      .quick-toggle input { width:16px; height:16px; accent-color:var(--coral); }
      .spin { position:relative; z-index:5; margin-top:26px; border:2px solid var(--ink); border-radius:9px; padding:16px 31px; color:#fff; background:var(--ink); font:20px 'Jua',sans-serif; cursor:pointer; box-shadow:5px 5px 0 var(--coral); transition:transform .15s,box-shadow .15s; }
      .spin:hover { transform:translate(2px,2px); box-shadow:3px 3px 0 var(--coral); }
      .spin:disabled { opacity:.65; cursor:wait; transform:none; }
      .result { display:none; }
      .result strong { display:block; font-family:'Jua',sans-serif; font-size:31px; color:var(--coral); margin-top:5px; }
      .winner { position:absolute; z-index:6; inset:0; margin:auto; width:185px; height:112px; border:2px solid var(--ink); border-radius:8px; background:#fffdf7; color:var(--ink); display:grid; place-content:center; text-align:center; font-size:14px; font-weight:bold; line-height:1.15; box-shadow:5px 5px 0 var(--coral); opacity:0; transform:scale(.35) rotate(-5deg); pointer-events:none; }
      .winner strong { display:block; font-family:'Jua',sans-serif; font-size:31px; color:var(--coral); margin-top:7px; }
      .winner.show { animation:pop .65s cubic-bezier(.18,1.35,.45,1) forwards; }
      @keyframes pop { to { opacity:1; transform:scale(1) rotate(0); } }
      footer { padding:0 0 14px; text-align:center; font:11px 'DM Mono',monospace; color:#687080; }
      @media(max-width:760px){ header{height:72px}.shell{width:min(100% - 28px,540px)}.tag{font-size:9px;padding:7px 9px}.logo{font-size:19px}main{display:flex; flex-direction:column; gap:10px; align-items:stretch; padding:27px 0 28px}.intro{font-size:15px}.mobile-break{display:inline}.tips{margin-top:20px}.roulette-zone{padding-top:30px}.sun{top:40px;width:min(86vw,460px)}.wheel-wrap{width:min(86vw,460px)}h1{font-size:50px}.pointer{top:-11px;border-left-width:18px;border-right-width:18px;border-top-width:43px}.hub{width:76px;height:76px;font-size:14px}.winner{width:155px;height:98px;font-size:13px}.winner strong{font-size:26px}.spin{padding:15px 25px;margin-top:23px}.menu-editor{width:min(290px,82vw); right:0}.menu-editor-form{flex-direction:column; align-items:stretch}.menu-editor-form input{width:100%}.menu-editor-form button{width:100%}.result{display:none} }
    </style>
  </head>
  <body>
    <div class="texture"></div>
    <!-- Supabase 클라이언트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <div class="shell">
      <header><div class="logo"><span class="logo-mark">✦</span>오늘 점심 뭐 먹지?</div><div class="tag">LUNCH DECIDER v2.0</div></header>
      <main>
        <section>
          <div class="eyebrow"><span></span>점심메뉴룰렛</div>
          <h1>점심 고민,<br /><em>1초</em>면 끝!</h1>
          <p class="intro">메뉴 앞에서 망설이느라<span class="mobile-break"><br /></span> 소중한 점심시간을 쓰지 마세요.<br />룰렛이 오늘의 한 끼를 시원하게 골라드릴게요.</p>
          <div class="tips"><span>🍴 혼밥도 OK</span><span>👯 단체 메뉴도 OK</span><span>📍 어디서나 찾기 쉬운 메뉴</span></div>
        </section>
        <section class="roulette-zone" aria-label="점심 메뉴 룰렛">
          <div class="sun"></div>
          <div class="roulette-toolbar">
            <button type="button" class="menu-editor-toggle" id="menuEditorToggle">메뉴 수정</button>
          </div>
          <div class="menu-editor" id="menuEditorPanel" aria-hidden="true">
            <div class="menu-editor-header">
              <span>메뉴 목록</span>
              <button type="button" class="menu-editor-close" id="closeMenuEditor" aria-label="메뉴 수정 닫기">×</button>
            </div>
            <div class="menu-list" id="menuList"></div>
            <div class="menu-editor-form">
              <input id="menuInput" type="text" maxlength="20" placeholder="새 메뉴 입력" aria-label="새 메뉴 입력" />
              <button type="button" id="addMenuButton">추가</button>
            </div>
          </div>
          <div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 500 500" role="img" aria-label="점심 메뉴 룰렛"></svg><div class="hub">오늘의<br />점심</div><div class="winner" id="winner">오늘의 점심은<strong></strong></div></div>
          <button class="spin" id="spinButton">점심 룰렛 돌리기 ✦</button>
          <label class="quick-toggle" for="quickResultToggle">
            <input type="checkbox" id="quickResultToggle" />
            <span>빠른 결과 보기</span>
          </label>
          <div class="result" id="result" aria-live="polite"></div>
        </section>
      </main>
      <footer>NO MORE LUNCH 고민 · 결정은 가볍게, 점심은 맛있게</footer>
    </div>
    <script>
      // ========== Supabase 초기화 ==========
      let supabaseClient = null;
      let sessionId = null;
      let sessionStartTime = null;
      let spinCount = 0;
      let quickResultEnabled = false;
      let quickResultClicked = false;
      let addedMenus = [];
      let removedMenus = [];
      const pendingInteractionEvents = [];

      function normalizeMenuText(value) {
        return String(value || '').trim().replace(/\s+/g, ' ');
      }

      function loadLocalSessionPreferences() {
        try {
          const savedQuick = localStorage.getItem('quickResultEnabled');
          const savedQuickClicked = localStorage.getItem('quickResultClicked');
          const savedAdded = localStorage.getItem('addedMenus');
          const savedRemoved = localStorage.getItem('removedMenus');

          quickResultEnabled = savedQuick === 'true';
          quickResultClicked = savedQuickClicked === 'true';
          addedMenus = savedAdded ? JSON.parse(savedAdded) : [];
          removedMenus = savedRemoved ? JSON.parse(savedRemoved) : [];

          addedMenus = Array.isArray(addedMenus) ? addedMenus.map(normalizeMenuText).filter(Boolean) : [];
          removedMenus = Array.isArray(removedMenus) ? removedMenus.map(normalizeMenuText).filter(Boolean) : [];
        } catch (error) {
          console.warn('⚠️ 로컬 상태 복원 실패:', error);
          quickResultEnabled = false;
          quickResultClicked = false;
          addedMenus = [];
          removedMenus = [];
        }
      }

      function saveLocalSessionPreferences() {
        localStorage.setItem('quickResultEnabled', String(quickResultEnabled));
        localStorage.setItem('quickResultClicked', String(quickResultClicked));
        localStorage.setItem('addedMenus', JSON.stringify(addedMenus));
        localStorage.setItem('removedMenus', JSON.stringify(removedMenus));
      }

      async function persistSessionMetadata() {
        if (!supabaseClient || !sessionId) return;

        try {
          const payload = {
            quick_result_enabled: Boolean(quickResultEnabled),
            quick_result_clicked: Boolean(quickResultClicked),
            added_menus: addedMenus,
            removed_menus: removedMenus,
            updated_at: new Date().toISOString()
          };

          const { error } = await supabaseClient
            .from('sessions')
            .update(payload)
            .eq('session_id', sessionId);

          if (error) {
            console.warn('⚠️ 세션 메타데이터 저장 실패:', error.message);
            return false;
          }

          return true;
        } catch (error) {
          console.warn('⚠️ 세션 메타데이터 저장 예외:', error);
          return false;
        }
      }

      async function persistInteractionEvent(eventType, menuValue = null, eventValue = null) {
        const event = {
          event_type: eventType,
          menu_value: menuValue,
          event_value: eventValue,
          occurred_at: new Date().toISOString()
        };

        if (!supabaseClient || !sessionId) {
          pendingInteractionEvents.push(event);
          return;
        }

        const { error } = await supabaseClient.from('roulette_interactions').insert([{
          session_id: sessionId,
          ...event
        }]);

        if (error) console.warn('⚠️ 사용자 행동 저장 실패:', error.message);
      }

      async function flushPendingInteractionEvents() {
        if (!supabaseClient || !sessionId || pendingInteractionEvents.length === 0) return;
        const events = pendingInteractionEvents.splice(0).map((event) => ({ session_id: sessionId, ...event }));
        const { error } = await supabaseClient.from('roulette_interactions').insert(events);
        if (error) {
          pendingInteractionEvents.unshift(...events.map(({ session_id: ignored, ...event }) => event));
          console.warn('⚠️ 대기 중인 사용자 행동 저장 실패:', error.message);
        }
      }

      async function initializeSupabase() {
        try {
          console.log('🔄 Supabase 초기화 시작...');
          
          const response = await fetch('/api/config');
          console.log('📡 /api/config 응답:', response.status);
          
          if (!response.ok) {
            const errorData = await response.json();
            console.error('❌ API 에러:', errorData);
            console.warn('⚠️ Supabase 미설정 - Vercel 환경변수 확인 필요');
            console.log('📝 확인 사항:');
            console.log('  1. Vercel Settings > Environment Variables 확인');
            console.log('  2. VITE_SUPABASE_URL 설정 여부 확인');
            console.log('  3. VITE_SUPABASE_ANON_KEY 설정 여부 확인');
            return;
          }
          
          const { supabase: config } = await response.json();
          console.log('✅ 환경변수 로드 성공');
          
          if (!config.url || !config.anonKey) {
            console.error('❌ 환경변수가 비어있습니다:', { url: !config.url, key: !config.anonKey });
            return;
          }

          supabaseClient = window.supabase.createClient(config.url, config.anonKey);
          console.log('✅ Supabase 클라이언트 생성 완료');
          
          sessionId = localStorage.getItem('sessionId');
          sessionStartTime = new Date();
          loadLocalSessionPreferences();
          
          if (!sessionId) {
            sessionId = `session_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            localStorage.setItem('sessionId', sessionId);
            console.log('📝 새 세션 생성:', sessionId);
          } else {
            const savedTime = localStorage.getItem('sessionStartTime');
            if (savedTime) sessionStartTime = new Date(savedTime);
            console.log('📝 기존 세션 복구:', sessionId);
          }

          const quickToggle = document.getElementById('quickResultToggle');
          if (quickToggle) quickToggle.checked = quickResultEnabled;
          
          if (!localStorage.getItem('sessionStartTime')) {
            localStorage.setItem('sessionStartTime', sessionStartTime.toISOString());
            
            // ✅ await로 완료될 때까지 기다리기 (중요!)
            try {
              const { error: insertError } = await supabaseClient.from('sessions').insert([{
                session_id: sessionId,
                start_time: sessionStartTime.toISOString()
              }]);
              
              if (insertError) {
                console.error('❌ 세션 테이블 저장 실패:');
                console.error('  - 에러 메시지:', insertError.message);
                console.error('  - 에러 코드:', insertError.code);
                console.error('  - 상태 코드:', insertError.status);
                console.error('  - 전체 에러:', insertError);
                console.log('📝 해결책:');
                console.log('  1. Supabase > sessions 테이블 확인');
                console.log('  2. RLS 정책 "Enable all access" 설정 확인');
              } else {
                console.log('✅ 세션 저장 완료 - roulette_spins 저장 가능!');
              }
            } catch (e) {
              console.error('❌ 세션 저장 중 예외:', e.message);
            }
          }

          // A browser may retain a session ID even if an earlier DB insert failed.
          // Ensure the parent session exists before writing interaction rows.
          const { error: ensureSessionError } = await supabaseClient.from('sessions').upsert([{
            session_id: sessionId,
            start_time: sessionStartTime.toISOString()
          }], {
            onConflict: 'session_id',
            ignoreDuplicates: true
          });

          if (ensureSessionError) {
            console.warn('⚠️ 세션 확인 실패:', ensureSessionError.message);
          } else {
            await persistSessionMetadata();
          }

          await flushPendingInteractionEvents();
          
          console.log('✅ Supabase 초기화 완료!');
        } catch (error) {
          console.error('❌ Supabase 초기화 에러:', error);
          console.log('📝 에러 세부사항:', error.message);
        }
      }

      window.addEventListener('beforeunload', async () => {
        if (!supabaseClient || !sessionId) return;
        const endTime = new Date();
        const durationMinutes = Math.round((endTime - sessionStartTime) / 60000);
        try {
          await supabaseClient.from('sessions').update({
            end_time: endTime.toISOString(),
            duration_minutes: durationMinutes,
            quick_result_enabled: Boolean(quickResultEnabled),
            quick_result_clicked: Boolean(quickResultClicked),
            added_menus: addedMenus,
            removed_menus: removedMenus,
            updated_at: endTime.toISOString()
          }).eq('session_id', sessionId);
        } catch (error) {
          console.warn('⚠️ 세션 저장 오류:', error);
        }
      });

      // ========== DOM 로드 완료 후 실행 ==========
      document.addEventListener('DOMContentLoaded', function() {
        loadLocalSessionPreferences();
        // Supabase 초기화
        initializeSupabase();

        // ========== 룰렛 메뉴 및 색상 ==========
        let menus = ['김치찌개','제육볶음','된장찌개','비빔밥','국밥','순두부찌개','칼국수','냉면','쌀국수','마라탕','짜장면','짬뽕','볶음밥','돈까스','라멘','초밥','우동','카레','파스타','피자','햄버거','샌드위치','샐러드','김밥','떡볶이','닭갈비','보쌈','족발','닭볶음탕','치킨','부대찌개','뚝배기불고기','설렁탕','콩나물국밥','분짜','팟타이'];
        const colors = ['#ff725e','#cbeef0','#d7f4cf','#ffc844','#f8a6a1','#b7d6f6','#f6d5a6','#c9b9ed'];
        const svg = document.getElementById('wheel');
        const menuEditorToggle = document.getElementById('menuEditorToggle');
        const menuEditorPanel = document.getElementById('menuEditorPanel');
        const closeMenuEditor = document.getElementById('closeMenuEditor');
        const menuList = document.getElementById('menuList');
        const menuInput = document.getElementById('menuInput');
        const addMenuButton = document.getElementById('addMenuButton');
        const quickResultToggle = document.getElementById('quickResultToggle');
        let currentDisk = null;
        
        if (!svg) {
          console.error('❌ SVG 요소를 찾을 수 없습니다');
          return;
        }

        const ns = 'http://www.w3.org/2000/svg';
        
        function el(name, attrs) {
          const e = document.createElementNS(ns, name);
          Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
          return e;
        }

        function renderMenuList() {
          if (!menuList) return;
          menuList.innerHTML = '';

          if (menus.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'menu-item';
            empty.innerHTML = '<span>등록된 메뉴가 없어요.</span>';
            menuList.appendChild(empty);
            return;
          }

          menus.forEach((menu, index) => {
            const item = document.createElement('div');
            item.className = 'menu-item';

            const label = document.createElement('span');
            label.textContent = menu;

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'remove-menu';
            removeBtn.setAttribute('aria-label', `${menu} 삭제`);
            removeBtn.textContent = '×';
            removeBtn.addEventListener('click', () => {
              const removed = menus.splice(index, 1)[0];
              if (removed) {
                removedMenus.push(removed);
                saveLocalSessionPreferences();
                persistSessionMetadata();
                persistInteractionEvent('menu_removed', removed);
              }
              renderMenuList();
              renderWheel();
              updateSpinButtonState();
            });

            item.append(label, removeBtn);
            menuList.appendChild(item);
          });
        }

        function renderWheel() {
          const existingDisk = document.getElementById('disk');
          if (existingDisk) existingDisk.remove();

          if (menus.length === 0) {
            const emptyDisk = el('g', { id: 'disk' });
            svg.append(emptyDisk);
            currentDisk = emptyDisk;
            return;
          }

          const total = menus.length;
          const slice = 360 / total;
          const disk = el('g', { id: 'disk' });

          menus.forEach((menu, i) => {
            const a1 = (-90 + i * slice) * Math.PI / 180;
            const a2 = (-90 + (i + 1) * slice) * Math.PI / 180;
            const r = 246;
            const d = `M250 250 L${250 + r * Math.cos(a1)} ${250 + r * Math.sin(a1)} A${r} ${r} 0 0 1 ${250 + r * Math.cos(a2)} ${250 + r * Math.sin(a2)} Z`;
            disk.append(el('path', { d, fill: colors[i % colors.length], stroke: '#1d2433', 'stroke-width': '1.4' }));

            const angle = -90 + (i + .5) * slice;
            const mid = angle * Math.PI / 180;
            const tx = 250 + 178 * Math.cos(mid);
            const ty = 250 + 178 * Math.sin(mid);
            const readable = angle > 90 && angle < 270 ? angle + 180 : angle;

            const t = el('text', {
              x: tx,
              y: ty,
              fill: '#1d2433',
              'font-family': 'Gowun Dodum, sans-serif',
              'font-size': '11',
              'font-weight': 'bold',
              'text-anchor': 'middle',
              'dominant-baseline': 'middle',
              transform: `rotate(${readable} ${tx} ${ty})`
            });
            t.textContent = menu;
            disk.append(t);
          });

          svg.append(disk);
          currentDisk = disk;
        }

        function updateSpinButtonState() {
          const button = document.getElementById('spinButton');
          if (!button) return;

          if (menus.length === 0) {
            button.disabled = true;
            button.textContent = '메뉴를 먼저 추가하세요';
            return;
          }

          button.disabled = false;
          button.textContent = '점심 룰렛 돌리기 ✦';
        }

        renderMenuList();
        renderWheel();
        updateSpinButtonState();

        if (menuEditorToggle && menuEditorPanel) {
          menuEditorToggle.addEventListener('click', () => {
            const isOpen = menuEditorPanel.classList.toggle('open');
            menuEditorPanel.setAttribute('aria-hidden', String(!isOpen));
          });
        }

        if (closeMenuEditor && menuEditorPanel) {
          closeMenuEditor.addEventListener('click', () => {
            menuEditorPanel.classList.remove('open');
            menuEditorPanel.setAttribute('aria-hidden', 'true');
          });
        }

        if (quickResultToggle) {
          quickResultToggle.checked = quickResultEnabled;
          quickResultToggle.addEventListener('change', () => {
            quickResultEnabled = quickResultToggle.checked;
            quickResultClicked = true;
            saveLocalSessionPreferences();
            persistSessionMetadata();
            persistInteractionEvent('quick_result_clicked', null, quickResultEnabled);
          });
        }

        if (addMenuButton && menuInput) {
          const addMenu = () => {
            const value = normalizeMenuText(menuInput.value);
            if (!value) {
              menuInput.focus();
              return;
            }

            if (menus.includes(value)) {
              menuInput.value = '';
              menuInput.focus();
              return;
            }

            menus.push(value);
            addedMenus.push(value);
            saveLocalSessionPreferences();
            persistSessionMetadata();
            persistInteractionEvent('menu_added', value);
            menuInput.value = '';
            renderMenuList();
            renderWheel();
            updateSpinButtonState();
          };

          addMenuButton.addEventListener('click', addMenu);
          menuInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') addMenu();
          });
        }

        // ========== 룰렛 실행 로직 ==========
        try {
          const button = document.getElementById('spinButton');
          const winner = document.getElementById('winner');
          const winnerName = winner.querySelector('strong');

          if (!button || !winner || !winnerName) {
            console.error('❌ 필수 DOM 요소를 찾을 수 없습니다');
            return;
          }

          let rotation = 0;
          let isSpinning = false;

          button.addEventListener('click', async () => {
            const disk = currentDisk || document.getElementById('disk');
            console.log('🖱️ 버튼 클릭됨 - isSpinning:', isSpinning, '메뉴 수:', menus.length, 'disk 존재:', !!disk);

            if (menus.length === 0 || !disk) {
              return;
            }

            if (isSpinning) {
              console.warn('⚠️ 이미 회전 중입니다');
              return;
            }

            const quickMode = quickResultToggle && quickResultToggle.checked;
            const total = menus.length;
            const slice = 360 / total;
            const picked = Math.floor(Math.random() * total);
            const center = picked * slice + slice / 2;

            isSpinning = true;
            button.disabled = true;
            winner.classList.remove('show');

            rotation += 360 * 7 + (360 - center - (rotation % 360));
            disk.style.transition = quickMode ? 'transform 0.18s ease' : 'transform 4.2s cubic-bezier(.13,.78,.1,1)';
            disk.style.transform = `rotate(${rotation}deg)`;

            spinCount++;

            const finishDelay = quickMode ? 180 : 4250;

            setTimeout(async () => {
              const selectedMenu = menus[picked];
              winnerName.textContent = selectedMenu;
              winner.classList.add('show');
              button.disabled = false;
              button.textContent = '한 번 더 돌리기 ↻';
              isSpinning = false;
              console.log('🎉 회전 완료 - 선택된 메뉴:', selectedMenu);

              if (supabaseClient && sessionId) {
                try {
                  console.log('💾 데이터 저장 시도:', { menu: selectedMenu, spinCount });

                  const { data, error } = await supabaseClient.from('roulette_spins').insert([{
                    session_id: sessionId,
                    menu: selectedMenu,
                    spin_count: spinCount,
                    spun_at: new Date().toISOString()
                  }]);

                  if (error) {
                    console.error('❌ 저장 실패:');
                    console.error('  - 에러 메시지:', error.message);
                    console.error('  - 에러 코드:', error.code);
                    console.error('  - 상태 코드:', error.status);
                    console.error('  - 전체 에러:', error);

                    if (error.message.includes('relation') || error.message.includes('roulette_spins')) {
                      console.log('📝 해결책: roulette_spins 테이블이 생성되어 있는지 확인하세요');
                    }
                    if (error.message.includes('permission')) {
                      console.log('📝 해결책: RLS 정책이 올바르게 설정되어 있는지 확인하세요');
                    }
                  } else {
                    console.log('✅ 데이터 저장 성공:', selectedMenu);
                  }
                } catch (e) {
                  console.error('⚠️ 저장 중 에러:', e);
                  console.error('  - 에러 메시지:', e.message);
                }
              } else {
                if (!supabaseClient) {
                  console.log('ℹ️ Supabase가 연결되지 않아 데이터 저장 안됨');
                }
                if (!sessionId) {
                  console.log('ℹ️ sessionId가 없어서 데이터 저장 안됨');
                }
              }
            }, finishDelay);
          });

          console.log('✅ 룰렛 준비 완료');
        } catch (error) {
          console.error('❌ 룰렛 이벤트 등록 실패:', error);
        }
      });
    </script>
  </body>
</html>
